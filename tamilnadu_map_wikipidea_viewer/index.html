<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tamil Nadu Districts – Wikipedia Viewer</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Tamil Nadu Districts – Wikipedia Viewer</h1>

<div class="main">

    <!-- Map Section -->
    <div class="container1">
        <img src="chennai-map.jpg"
             alt="Tamil Nadu District Map"
             usemap="#image-map">

        <map name="image-map">
            <area class="chennai" shape="rect"
                  coords="474,48,462,76">

            <area class="kanchipuram" shape="poly"
                  coords="410,76,415,112,456,75">

            <area class="tiruvallur" shape="poly"
                  coords="467,18,418,46,429,66,479,39,474,27">

            <area class="vellore" shape="poly"
                  coords="322,79,323,102,354,92,361,63,304,63,290,90">

            <area class="salem" shape="poly"
                  coords="187,194,250,202,308,241,270,226,204,245">

            <area class="madurai" shape="poly"
                  coords="160,460,221,399,262,408,226,443">

            <area class="tirunelveli" shape="poly"
                  coords="125,566,163,555,191,545,199,613,163,595">

            <area class="coimbatore" shape="poly"
                  coords="97,379,118,329,106,264,81,276">
        </map>
    </div>

    <!-- Frame Section -->
    <div class="container2">
        <iframe class="iframe1"></iframe>
    </div>

</div>

<!-- External JavaScript -->
<script src="script.js"></script>
</body>
</html>
